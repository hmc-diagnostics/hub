<style>
:root{
  --bg:#F2F5F5; --surface:#FFFFFF; --ink:#13232A; --muted:#5D6E75; --line:#DCE4E6;
  --accent:#0B5868; --accent-soft:#E2EFF1; --accent-ink:#FFFFFF;
  --good:#1D7F55; --good-soft:#E3F3EB; --warn:#9A6512; --warn-soft:#FBF0DC; --bad:#B8401A; --bad-soft:#FBE7DF;
  --fd:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif; --fb:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E171A; --surface:#152227; --ink:#E4ECEE; --muted:#93A6AD; --line:#26363C;
  --accent:#4FB3C4; --accent-soft:#173840; --accent-ink:#06191D;
  --good:#5BC994; --good-soft:#143326; --warn:#E3B05A; --warn-soft:#3A2C12; --bad:#F08A63; --bad-soft:#3D1F15; color-scheme:dark;}}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance} h1{font-size:19px} h2{font-size:17px}
.num{font-variant-numeric:tabular-nums}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hin{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;margin-inline-end:auto}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand small{display:block;color:var(--muted);font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{font:inherit;font-weight:600;font-size:14px;padding:7px 12px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 70px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.ch{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.muted{color:var(--muted)} .small{font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{display:block;margin-top:5px}
.req{color:var(--bad)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:80px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:11px 18px;border:1px solid transparent;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none}
.btn.p{background:var(--accent);color:var(--accent-ink)} .btn.g{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.d{background:transparent;color:var(--bad);border-color:var(--bad-soft)} .btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.big{width:100%;padding:26px 18px;font-size:21px;font-family:var(--fd);border-radius:16px;background:var(--accent);color:var(--accent-ink);border:0;cursor:pointer;display:grid;gap:4px;place-items:center;box-shadow:0 6px 18px rgba(11,88,104,.25)}
.big small{font-family:var(--fb);font-size:13px;font-weight:500;opacity:.85}
.big:disabled{opacity:.6}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.xlbox{display:grid;gap:8px;border:1px dashed var(--line,#cbd5e1);border-radius:14px;padding:12px;background:rgba(16,185,129,.05)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative} .chip input{position:absolute;inset:0;opacity:0;cursor:pointer}
.chip span{display:inline-block;padding:7px 13px;border:1px solid var(--line);border-radius:999px;font-size:14px;background:var(--bg)}
.chip input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.banner{padding:11px 14px;border-radius:10px;font-size:14px}
.b-ok{background:var(--good-soft);color:var(--good)} .b-err{background:var(--bad-soft);color:var(--bad)} .b-info{background:var(--accent-soft);color:var(--accent)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px}
.kpi .v{font-family:var(--fd);font-size:25px;font-weight:600} .kpi .l{color:var(--muted);font-size:13px}
.kpi.alert{box-shadow:inset -3px 0 0 var(--bad)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:70px} .bar i{display:block;height:100%;background:var(--accent)}
.bar.ok i{background:var(--good)} .bar.low i{background:var(--warn)}
.tw{overflow-x:auto} table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;color:var(--muted);font-weight:600;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top} tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pg{background:var(--good-soft);color:var(--good)} .pw{background:var(--warn-soft);color:var(--warn)} .pb{background:var(--bad-soft);color:var(--bad)} .pn{background:var(--accent-soft);color:var(--accent)}
.live{border:2px solid var(--accent);background:var(--accent-soft)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--good);display:inline-block;margin-inline-end:6px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.3}} @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;padding:8px 12px;border:0;background:var(--surface);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end} .filters label.f{min-width:150px}
.two{display:grid;gap:16px;grid-template-columns:1.5fr 1fr} @media (max-width:860px){.two{grid-template-columns:1fr}}
.hb{display:grid;grid-template-columns:140px 1fr 34px;gap:10px;align-items:center;font-size:13.5px;margin-bottom:8px}
.empty{padding:24px 10px;text-align:center;color:var(--muted)}
.vlist{display:grid;gap:9px}
.vi{border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:grid;gap:5px}
.vi .r1{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.vi .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.loading{display:grid;place-items:center;padding:60px 10px;color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.org{display:grid;gap:6px}
.org-row{display:block}
.org-node{font:inherit;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center;text-align:start}
.org-node:hover{border-color:var(--accent)}
.org-node.off{opacity:.55}
.org-dot{width:10px;height:10px;border-radius:50%;flex:none}
.org-txt{display:grid;flex:1;min-width:0}
.org-txt small{color:var(--muted);font-size:12px}
.org-ed{font-size:13px;opacity:.6}
.seg.mt{display:flex;width:100%}
.seg.mt button{flex:1 1 22%;padding:11px 6px;font-size:14px;white-space:nowrap}
.seg button:disabled{opacity:.4;cursor:default}
main>*{min-width:0}
.tree-hint{display:none;margin-bottom:6px}@media (max-width:600px){.tree-hint{display:block}}
.tree-wrap{max-width:100%;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.tree{display:inline-block;min-width:100%}
.tree ul{position:relative;display:flex;justify-content:center;margin:0;padding:20px 0 0}
.tree>ul{padding-top:0}
.tree li{list-style:none;position:relative;padding:20px 5px 0;display:flex;flex-direction:column;align-items:center}
.tree>ul>li{padding-top:0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;width:50%;height:20px;border-top:2px solid var(--line)}
.tree li::before{left:0}
.tree li::after{right:0;border-left:2px solid var(--line)}
.tree li:first-child::after{border-top:0}
.tree li:last-child::before{border-top:0}
.tree li:only-child::before{border-top:0}
.tree>ul>li::before,.tree>ul>li::after{display:none}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;height:20px;border-left:2px solid var(--line)}
.staff{display:grid;grid-template-columns:1fr 1fr;width:100%;position:relative;padding:14px 0 0}
.staff::before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:2px solid var(--line)}
.staff.end::before{bottom:50%}
.staff .aside{grid-column:1;display:flex;align-items:center;justify-content:flex-end;gap:0}
.tn.ext{opacity:.55;border-style:dashed}
.row.rel{gap:6px}.row.rel .btn{flex:1;min-width:120px}
.staff .aside .tn{border-style:dashed;border-top-style:solid}
.staff .hl{width:22px;border-top:2px dashed var(--line);flex:none}
.tn{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:10px;padding:9px 10px;min-width:112px;max-width:150px;display:grid;gap:3px;justify-items:center;cursor:pointer;text-align:center}
.tn:hover{box-shadow:0 3px 10px rgba(0,0,0,.08)}
.tn b{font-size:13px;line-height:1.3}.tn small{font-size:11px;color:var(--muted)}.tn .pill{font-size:10.5px}
.tn.off{opacity:.5}
.seg.wide{display:flex;width:100%}.seg.wide button{flex:1;min-width:0;white-space:normal;line-height:1.3}
.seg.mt{flex-wrap:wrap}

const RULES=[[/^زيارة في (.+)$/,"visits in $1"],[/^مدينة(: (.+))?$/,(m,a,b)=>"cities"+(b?": "+b:"")],[/^أهلاً (.+) 👋$/,"Hello $1 👋"],[/^شيت مستنيك تعتمده$/,"sheets awaiting your approval"],[/^شيت مستنيك تراجعه$/,"sheets awaiting your review"],
[/^✨ جهّز شيت (.+) من زياراتي$/,"✨ Prepare $1 sheet from my visits"],[/^جهّز شيت (.+) من زياراتي$/,"Prepare $1 sheet from my visits"],[/^الشيتات اللي مستنياني \((\d+)\)$/,"Sheets waiting for me ($1)"],[/^✨ جهّز الشيت من زياراتي$/,"✨ Prepare sheet from my visits"],[/^✅ الشيتات اللي مستنياني \((\d+)\)$/,"✅ Sheets waiting for me ($1)"],[/^كل واحد: زياراته ومصروفاته في (.+)$/,"Everyone: visits & expenses in $1"],
[/^مقترح: (.+)$/,"Suggested: $1"],[/^✓ اتعملت:$/,"✓ Created:"],[/^— $/,"— "],[/^اتضاف (\d+) يوم بدل من (\d+) يوم زيارات ✓ — راجع الشيت وابعته$/,"Added $1 allowance days from $2 visit days ✓ — review and submit"]];
function tx(v){if(LANG!=="en"||v==null)return v;const k=String(v),m=k.match(/^(\s*)([\s\S]*?)(\s*)$/);const c=m[2];if(!c)return k;if(DICT[c])return m[1]+DICT[c]+m[3];for(const [re,rep] of RULES){if(re.test(c))return m[1]+c.replace(re,rep)+m[3];}return k;}
function trDom(root){if(LANG!=="en"||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(n=>{const v=tx(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;});
  root.querySelectorAll("[title],[placeholder]").forEach(e=>{["title","placeholder"].forEach(a=>{if(e.hasAttribute(a))e.setAttribute(a,tx(e.getAttribute(a)));});});}
const n2=x=>(Math.round((+x||0)*100)/100).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2});
const store={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
function toast(m){const t=$("#toast");t.textContent=tx(m);t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),3200);}
function call(fn,...args){return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args})}).then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(String(j.error||"حصل خطأ").replace(/^Error: ?/,""));return j.data;}).catch(e=>{throw new Error(e.message==="Failed to fetch"?"مفيش إنترنت — جرّب تاني":e.message);});}
const now=new Date();
const S={init:store.get("hubInit"),sess:store.get("hub"),tab:"home",m:now.getMonth()+1,y:now.getFullYear(),data:null,dept:store.get("hubDept")||"",mgrLogin:false,loaded:{}};
const ST={draft:"مسودة",submitted:"بانتظار المراجعة",reviewed:"بانتظار الاعتماد",approved:"معتمد",returned:"مرتجع للتعديل"};
function stChip(sh){if(!sh)return '<span class="st none">مفيش شيت</span>';return `<span class="st ${sh.status}">${esc(ST[sh.status]||sh.status)}</span>`;}
/* ---------- sessions shared with the two apps (same site) ---------- */
function setAppSessions(){const x=S.sess;["rep","mgr","eme","emgr"].forEach(k=>store.del(k));
  if(!x)return; if(x.mode==="emp"){store.set("rep",x.fp);if(x.exp)store.set("eme",x.exp);} else {if(x.keys.fpMgr)store.set("mgr",x.keys.fpMgr);if(x.keys.expMgr)store.set("emgr",x.keys.expMgr);}
  S.loaded={};["fFP","fEX"].forEach(id=>{$("#"+id).removeAttribute("src");});}
function logout(){if(!confirm(tx("تسجيل خروج من البوابة والبرنامجين؟")))return;S.sess=null;S.data=null;store.del("hub");setAppSessions();S.tab="home";render();}
/* ---------- tabs ---------- */
function drawTabs(){const t=$("#tabs");if(!S.sess){t.hidden=true;return;}t.hidden=false;const mgr=S.sess.mode==="mgr";
  const L=[["home","🏠 الرئيسية"],["fp",mgr?"📊 لوحة الزيارات":"📍 زياراتي"],["ex",mgr?"🧾 لوحة المصروفات":"🧾 مصروفاتي"]];
  t.innerHTML=L.map(([k,l])=>`<button type="button" data-t="${k}" ${S.tab===k?'aria-current="page"':""}>${l}</button>`).join("");
  t.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.t));trDom(t);}
function go(t){S.tab=t;try{history.pushState({t},"");}catch(e){}show();}
window.addEventListener("popstate",e=>{S.tab=(e.state&&e.state.t)||"home";show();});
function show(){drawTabs();["fFP","fEX"].forEach(i=>{const f=$("#"+i);if(f&&f.src)guardFrame(f);});const fr=t=>({fp:["fFP",FP_URL],ex:["fEX",EX_URL]})[t];
  if(S.tab==="home"){$("#frames").style.display="none";$("#app").style.display="";render(true);return;}
  $("#app").style.display="none";$("#frames").style.display="block";
  ["fFP","fEX"].forEach(id=>$("#"+id).style.display="none");const [id,url]=fr(S.tab);const f=$("#"+id);f.style.display="block";
  if(!S.loaded[id]){f.onload=()=>guardFrame(f);f.src=url+"?hub=1";S.loaded[id]=1;}}
function guardFrame(f){let d;try{d=f.contentDocument;}catch(e){return;}if(!d||!d.head)return;const emp=!S.sess||S.sess.mode!=="mgr";let st=d.getElementById("hubGuard");
  if(emp&&!st){st=d.createElement("style");st.id="hubGuard";st.textContent='[data-v="mgr"],#mgrLink,#toMgr{display:none!important}';d.head.appendChild(st);}
  if(!emp&&st)st.remove();}
function reloadFrames(){S.loaded={};["fFP","fEX"].forEach(id=>$("#"+id).removeAttribute("src"));if(S.tab!=="home")show();}
const IC={back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
 ref:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>',
 out:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/></svg>',
 bk:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg>'};
function goBack(){if(S.tab!=="home"||history.state&&history.state.t){history.back();}else toast(LANG==="en"?"You're on the home page":"أنت في الرئيسية");}
async function doBackup(){if(!S.sess||S.sess.mode!=="mgr"){toast("النسخة الاحتياطية للمدير بس");return;}
  const b=$("#tBk");if(b)b.disabled=true;toast("جارِ عمل النسخة… (ممكن تاخد دقيقة)");
  try{const r=await call("apiBackup",S.sess.pin);const o=$("#bkOut");if(o){o.innerHTML=`✓ ${LANG==="en"?"Created":"اتعملت"}: ${r.files.map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>`).join(" · ")} — <a href="${esc(r.folder)}" target="_blank" rel="noopener">${tx("فولدر النسخ")}</a>`;}
    toast(LANG==="en"?"Backup created ✓":"اتعملت النسخة الاحتياطية ✓");if(!o)window.open(r.folder,"_blank");}catch(ex){toast(ex.message);}if(b)b.disabled=false;}
function setLang(l){LANG=l;try{localStorage.setItem("lang",l);}catch(e){}location.reload();}
function drawTools(){const t=$("#tools");const mgr=S.sess&&S.sess.mode==="mgr";
  t.innerHTML=(S.sess?`<button class="btn g sm" id="tBack" title="رجوع">${IC.back}</button>`:"")+`<button class="btn g sm" id="tRef" title="تحديث">${IC.ref}</button>`+
   (mgr?`<button class="btn g sm" id="tBk" title="نسخة احتياطية Excel">${IC.bk}</button>`:"")+
   `<button class="btn g sm" id="tLang" title="${LANG==="en"?"عربي":"English"}" style="font-weight:700">${LANG==="en"?"ع":"EN"}</button>`+
   (S.sess?`<button class="btn g sm" id="tOut" title="تسجيل خروج">${IC.out}</button>`:"");
  const tb=$("#tBack");if(tb)tb.onclick=goBack;
  $("#tRef").onclick=async()=>{if(S.tab!=="home"){const id=S.tab==="fp"?"fFP":"fEX";try{$("#"+id).contentWindow.location.reload();}catch(e){}return;}await load();render();toast("اتحدّث ✓");};
  const bk=$("#tBk");if(bk)bk.onclick=doBackup;
  $("#tLang").onclick=()=>setLang(LANG==="en"?"ar":"en");
  const o=$("#tOut");if(o)o.onclick=logout;
  $("#who").textContent=tx(S.sess?(S.sess.mode==="mgr"?"لوحة المدير":S.sess.me.name):"نبض الميدان + المصروفات");trDom(t);}
/* ---------- views ---------- */
function monthBar(){return `<div class="mbar"><select id="hM" aria-label="الشهر">${MON.map((x,i)=>`<option value="${i+1}" ${i+1===S.m?"selected":""}>${x}</option>`).join("")}</select>
   <select id="hY" aria-label="السنة">${[now.getFullYear()-1,now.getFullYear()].map(y=>`<option ${y===S.y?"selected":""}>${y}</option>`).join("")}</select></div>`;}
const ADMIN=/admin/i.test(location.search+location.hash);
function viewLogin(){const P=(S.init&&S.init.people)||[];const ds=[...new Set(P.map(p=>p.dept))];const d=ds.includes(S.dept)?S.dept:(ds[0]||"");
  if(S.mgrLogin)return `<section class="login2"><div class="lg"><div class="ti">🔐</div><div><h2>دخول المدير</h2><p class="muted small">بالرقم السري للمدير بتاع نبض الميدان أو المصروفات — هيفتحلك اللوحتين مرة واحدة.</p></div></div>
   <label class="f" for="mPin">الرقم السري للمدير<input id="mPin" type="password" inputmode="numeric"></label><div class="banner b-err" id="lErr" hidden></div>
   <button class="btn p" id="mGo" type="button" style="padding:14px">دخول</button><button class="btn g sm" id="toEmp" type="button" style="justify-self:start">← دخول الموظف</button></section>`;
  return `<section class="login2"><div class="lg"><div class="ti">👋</div><div><h2>أهلاً في بوابة HMC</h2><p class="muted small">دخول واحد لزياراتك ومصروفاتك. اختار قسمك واسمك واكتب الرقم السري بتاع نبض الميدان.</p></div></div>
   ${ds.length>1?`<label class="f" for="lDept">القسم<select id="lDept">${ds.map(x=>`<option ${x===d?"selected":""}>${esc(x)}</option>`).join("")}</select></label>`:""}
   <label class="f" for="lName">اسمك<select id="lName"><option value="">اختار اسمك…</option>${P.filter(p=>p.dept===d).sort((a,b)=>a.name.localeCompare(b.name,"ar")).map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</select></label>
   <label class="f" for="lPin">الرقم السري<input id="lPin" type="password" inputmode="numeric" autocomplete="current-password"></label>
   <div class="banner b-err" id="lErr" hidden></div>
   <button class="btn p" id="lGo" type="button" style="padding:14px">دخول</button>
   ${ADMIN?`<button class="btn g sm" id="toMgr" type="button" style="justify-self:start">🔐 دخول المدير</button>`:""}</section>`;}
function kc(ic,val,label,extra,cls){return `<div class="kc ${cls||""}"><div class="ic">${ic}</div><div><b>${val}</b><span>${label}</span>${extra||""}</div></div>`;}
function tile(id,ic,title,sub,main){return `<button class="tile ${main?"main":""}" id="${id}" type="button"><div class="ti">${ic}</div><div><b>${title}</b><small>${sub}</small></div></button>`;}
function viewEmp(){const d=S.data,s=d&&d.sum,me=S.sess.me;if(!d)return `<div class="loading">جارِ التحميل…</div>`;
  return `<div class="wrap"><section class="hero2"><div class="top"><div><h2>أهلاً ${esc(me.name)} 👋</h2><div class="sub">${esc(me.position||"")}${me.dept?" · "+esc(me.dept):""}</div></div>${monthBar()}</div></section>
   ${S.sess.exp?"":`<div class="banner b-err">حسابك في المصروفات مش مربوط لسه — المدير يربطه من البوابة. الزيارات شغالة عادي.</div>`}
   <div class="kg">${kc("📍",s.visits,`زيارة في ${MON[S.m-1]}`)}${kc("🗓️",s.days,"يوم ميداني")}${kc("🏙️",s.cities.length,`مدينة${s.cities.length?": "+esc(s.cities.slice(0,3).join("، ")):""}`)}
    ${kc("🧾",s.sheet?n2(s.sheet.total):"—","مصروفات الشهر (ر.س)",`<div>${stChip(s.sheet)}</div>`)}
    ${s.queue?kc("✅",s.queue,me.expRole==="معتمد نهائي"?"شيت مستنيك تعتمده":"شيت مستنيك تراجعه","","warn"):""}</div>
   <section class="sec"><h3>اعمل إيه دلوقتي؟</h3><div class="tiles">
    ${tile("aVisit","📍","سجّل زيارة","وصلت عند العميل · الخطة · العملاء",1)}
    ${tile("aExp","🧾","افتح مصروفاتي","الشيت الشهري والـExcel والـPDF")}
    ${S.sess.exp?tile("aDraft","✨",`جهّز شيت ${MON[S.m-1]} من زياراتي`,"بدل يومي لكل يوم زيارة"):""}
    ${s.queue?tile("aQueue","✅",`الشيتات اللي مستنياني (${s.queue})`,"مراجعة / اعتماد"):""}
   </div><p class="note" style="margin:10px 0 0">«جهّز الشيت من زياراتي» بيضيف بدل يومي لكل يوم فيه زيارة (لو مش موجود)، وبعدين تراجعه وتعدّل النوع (كامل/نص يوم) وتضيف باقي المصاريف وتبعته.</p></section></div>`;}
function viewMgr(){const d=S.data;if(!d)return `<div class="loading">جارِ التحميل…</div>`;
  const opts=r=>`<option value="">— مش مربوط —</option>${r.suggest?`<option value="${esc(r.suggest.id)}">مقترح: ${esc(r.suggest.name)}</option>`:""}${d.exps.filter(e=>!e.linked||e.id===r.expId).map(e=>`<option value="${esc(e.id)}" ${e.id===r.expId?"selected":""}>${esc(e.name)}</option>`).join("")}<option value="new">➕ اعمله حساب مصروفات جديد</option>`;
  return `<div class="wrap"><section class="hero2"><div class="top"><div><h2>لوحة المدير — الزيارات والمصروفات</h2><div class="sub">HMC Diagnostics</div></div>${monthBar()}</div></section>
   <div class="kg">${kc("📍",d.totals.visits,`زيارة في ${MON[S.m-1]}`)}${kc("🧾",n2(d.totals.expenses),"مصروفات الشهر (ر.س)")}${kc("⏳",d.pending.submitted,"بانتظار المراجعة","",d.pending.submitted?"warn":"")}${kc("✍️",d.pending.reviewed,"بانتظار الاعتماد","",d.pending.reviewed?"warn":"")}${kc("🔗",d.rows.filter(r=>!r.expId).length,"مش مربوطين بالمصروفات")}</div>
   <section class="sec"><div class="tiles">${tile("aFP","📊","لوحة الزيارات","الأرقام · العملاء · الفريق · التقارير",1)}${tile("aEX","🧾","لوحة المصروفات","الشيتات · الموظفين · الإعدادات")}${tile("aBk","💾","نسخة احتياطية Excel دلوقتي","الشيتين على Drive")}</div><div id="bkOut" class="small" style="margin-top:8px"></div></section>
   <section class="sec"><h3>كل واحد: زياراته ومصروفاته في ${MON[S.m-1]} ${S.y}</h3><div class="tw2"><table class="tbl"><thead><tr><th>الاسم</th><th>القسم</th><th>زيارات</th><th>أيام</th><th>شيت المصروفات</th><th>الإجمالي</th><th>حسابه في المصروفات</th></tr></thead><tbody>
   ${d.rows.sort((a,b)=>b.visits-a.visits||a.name.localeCompare(b.name,"ar")).map(r=>`<tr><td><b>${esc(r.name)}</b><div class="small muted">${esc(r.position||"")}</div></td><td>${esc(r.dept)}</td><td>${r.visits}</td><td>${r.days}</td><td>${r.expId?stChip(r.sheet):'<span class="st none">—</span>'}</td><td>${r.sheet?n2(r.sheet.total):"—"}</td>
    <td><select data-link="${esc(r.fpId)}" style="max-width:220px">${opts(r)}</select></td></tr>`).join("")}</tbody></table></div>
   <p class="note">الربط بيخلّي الموظف يدخل الاتنين برقم سري واحد (بتاع نبض الميدان)، وأيام زياراته تتنقل لشيت مصروفاته. «مقترح» يعني لقينا اسم أو إيميل شبهه.</p>
   <p class="small"><a href="${esc(d.links.fpSheet)}" target="_blank" rel="noopener">شيت نبض الميدان ↗</a> · <a href="${esc(d.links.expSheet)}" target="_blank" rel="noopener">شيت المصروفات ↗</a></p></section></div>`;}
function render(keepTab){drawTools();drawTabs();const a=$("#app");
  if(!S.init){a.innerHTML='<div class="loading">جارِ التحميل…</div>';trDom(a);return;}
  if(!S.sess){$("#frames").style.display="none";a.style.display="";a.innerHTML=viewLogin();trDom(a);bindLogin();return;}
  if(S.tab!=="home"&&!keepTab){show();return;}
  a.innerHTML=S.sess.mode==="mgr"?viewMgr():viewEmp();trDom(a);bindHome();}
function bindLogin(){const ld=$("#lDept");if(ld)ld.onchange=()=>{S.dept=ld.value;store.set("hubDept",ld.value);render();};
  const tm=$("#toMgr");if(tm)tm.onclick=()=>{S.mgrLogin=true;render();};const te=$("#toEmp");if(te)te.onclick=()=>{S.mgrLogin=false;render();};
  const err=m=>{const e=$("#lErr");e.textContent=tx(m);e.hidden=false;};
  const lg=$("#lGo");if(lg)lg.onclick=async()=>{const id=$("#lName").value,pin=$("#lPin").value.trim();if(!id)return err("اختار اسمك");if(!pin)return err("اكتب الرقم السري");
    lg.disabled=true;lg.textContent="جارِ الدخول…";try{const r=await call("apiHubLogin",id,pin,S.m,S.y);S.sess={mode:"emp",fp:r.fp,exp:r.exp,me:r.me};store.set("hub",S.sess);setAppSessions();S.data=r;S.tab="home";render();}catch(ex){err(ex.message);lg.disabled=false;lg.textContent="دخول";}};
  const lp=$("#lPin");if(lp)lp.onkeydown=e=>{if(e.key==="Enter")lg.click();};
  const mg=$("#mGo");if(mg)mg.onclick=async()=>{const pin=$("#mPin").value.trim();if(!pin)return err("اكتب الرقم السري");mg.disabled=true;
    try{const r=await call("apiHubMgr",pin,S.m,S.y);S.sess={mode:"mgr",pin,keys:r.keys};store.set("hub",S.sess);setAppSessions();S.data=r;S.tab="home";render();}catch(ex){err(ex.message);mg.disabled=false;}};
  const mp=$("#mPin");if(mp)mp.onkeydown=e=>{if(e.key==="Enter")mg.click();};}
async function load(){if(!S.sess)return;const x=S.sess;
  try{if(x.mode==="emp"){const r=await call("apiHubLogin",x.fp.id,x.fp.pin,S.m,S.y);x.exp=r.exp;x.me=r.me;store.set("hub",x);if(r.exp)store.set("eme",r.exp);S.data=r;}
   else{const r=await call("apiHubMgr",x.pin,S.m,S.y);x.keys=r.keys;store.set("hub",x);S.data=r;}}
  catch(e){if(/غلط/.test(e.message)){S.sess=null;store.del("hub");setAppSessions();toast("الرقم السري اتغيّر — ادخل تاني");}else toast(e.message);}}
function bindHome(){const hm=$("#hM"),hy=$("#hY");const ch=async()=>{S.m=+hm.value;S.y=+hy.value;S.data=null;render();await load();render();};if(hm)hm.onchange=ch;if(hy)hy.onchange=ch;
  const b=(id,f)=>{const e=$("#"+id);if(e)e.onclick=f;};
  b("aVisit",()=>go("fp"));b("aExp",()=>go("ex"));b("aQueue",()=>go("ex"));b("aFP",()=>go("fp"));b("aEX",()=>go("ex"));
  b("aDraft",async()=>{const e=$("#aDraft");e.disabled=true;e.textContent="جارِ التجهيز…";try{const r=await call("apiHubDraft",S.sess.fp.id,S.sess.fp.pin,S.m,S.y);toast(r.added?`اتضاف ${r.added} يوم بدل من ${r.days} يوم زيارات ✓ — راجع الشيت وابعته`:"كل أيام الزيارات موجودة في الشيت بالفعل");await load();S.loaded.fEX=0;$("#fEX").removeAttribute("src");go("ex");}catch(ex){toast(ex.message);e.disabled=false;e.textContent="✨ جهّز الشيت من زياراتي";}});
  b("aBk",doBackup);
  document.querySelectorAll("[data-link]").forEach(s=>s.onchange=async()=>{s.disabled=true;try{const m=await call("apiHubLink",S.sess.pin,s.dataset.link,s.value);toast(m);await load();render();}catch(ex){toast(ex.message);s.disabled=false;}});}
(async()=>{if(LANG==="en"){document.documentElement.lang="en";document.documentElement.dir="ltr";document.title="HMC Hub";}trDom(document.querySelector("header"));render();
  try{const i=await call("apiHubInit");S.init=i;store.set("hubInit",{appName:i.appName,depts:i.depts,people:i.people});if(i.logo){const l=$("#logo");l.src=i.logo;l.style.display="";}}catch(e){if(!S.init){$("#app").innerHTML=`<div class="banner b-err">${esc(e.message)}</div>`;return;}}
  if(S.sess){render();await load();}
  try{history.replaceState({t:"home"},"");}catch(e){}
  render();})();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
